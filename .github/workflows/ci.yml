name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (editable + dev)
        run: python -m pip install -e ".[dev]"

      # Stage5/6 sandbox integration stays ignored: needs the live
      # 'all-in-one-sandbox' container image + agent-sandbox SDK.
      # Everything else runs: red-test cleanup (issue 02) fixed the
      # upstream-drift tests, the flaky cancel-safety test, the PATH-
      # polluting env-filter tests, and the credential-env leakage.
      # Real-LLM tests self-skip when no DEEPSEEK_API_KEY is set.
      - name: Run tests
        run: >
          python -m pytest engram/backend/tests/ -q
          --ignore=engram/backend/tests/v1/unit/sandbox/test_stage5_integration.py
          --ignore=engram/backend/tests/v1/unit/sandbox/test_stage6_integration.py
