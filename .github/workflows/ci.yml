name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      # Live Postgres for the checkpointer recovery test
      # (skipped locally unless ENGRAM_TEST_PG_DSN is set).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: engram
          POSTGRES_PASSWORD: engram
          POSTGRES_DB: engram
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENGRAM_TEST_PG_DSN: postgresql://engram:engram@localhost:5432/engram
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (editable + dev)
        run: python -m pip install -e ".[dev]"

      # Config docs are generated from AST reads; any drift (code adds a
      # variable, docs/template edited by hand) fails here.
      - name: Verify configuration docs
        run: python -m engram.backend.app.cli.config_scanner --check

      # Stage5/6 sandbox integration stays ignored: needs the live
      # 'all-in-one-sandbox' container image + agent-sandbox SDK.
      # Everything else runs: red-test cleanup (issue 02) fixed the
      # upstream-drift tests, the flaky cancel-safety test, the PATH-
      # polluting env-filter tests, and the credential-env leakage.
      # Real-LLM tests self-skip when no DEEPSEEK_API_KEY is set.
      - name: Run tests
        run: >
          python -m pytest engram/backend/tests/ -q
          --ignore=engram/backend/tests/v1/unit/sandbox/test_stage5_integration.py
          --ignore=engram/backend/tests/v1/unit/sandbox/test_stage6_integration.py
