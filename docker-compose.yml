# Engram docker-compose — 一键启动深度研究 Agent
#
# 用法:
#   docker compose run --rm agent              # TUI 交互（首次会启动配置向导）
#   docker compose run --rm agent cli          # 传统 CLI 滚动模式
#   docker compose run --rm agent run "问题"   # 单次研究
#
# 配置:
#   1. 首次运行容器内会触发配置向导（生成 /app/.env）
#   2. 或在宿主机项目根创建 .env，通过 env_file 注入
#
# 数据持久化:
#   .engram/ → /app/.engram（DB、日志、artifact、memory、MCP 配置）
#   skills/  → /app/skills（用户上传 skill）
#
# Sandbox:
#   容器内默认 Local sandbox（ENGRAM_SANDBOX_EXECUTOR=local）。
#   如需 Docker 隔离 sandbox，取消下方 docker.sock 挂载注释 + 改 .env:
#     ENGRAM_SANDBOX_USE=engram.backend.agents.sandbox.docker.docker_sandbox_provider:DockerSandboxProvider
#     ENGRAM_SANDBOX_EXECUTOR=local

services:
  agent:
    build: .
    image: engram:latest
    container_name: engram-agent
    stdin_open: true      # 交互式输入
    tty: true             # 终端色彩 + TUI 全屏
    env_file:
      - path: .env        # 宿主机 .env（不存在则忽略）
        required: false
    environment:
      # 容器内默认开启 memory + multiagent（可被 .env 覆盖）
      - ENGRAM_MEMORY_USE=default
      - ENGRAM_MEMORY_PHASE2_ENABLED=true
      - ENGRAM_MULTIAGENT_ENABLED=true
      # LangGraph 会话状态持久层（issue 05）——指向 compose 内 postgres
      - ENGRAM_CHECKPOINT_DSN=postgresql://engram:engram@postgres:5432/engram
      # 记忆热层（issue 06）——指向 compose 内 redis；不设则回退 Markdown 存储
      - ENGRAM_REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./.engram:/app/.engram   # 运行时数据持久化（DB/logs/memory/artifacts）
      - ./skills:/app/skills     # 用户 skill 持久化
      - ./.env:/app/.env         # .env 持久化（Ctrl+B 面板可写回）
      # Docker sandbox 模式：挂载宿主机 docker.sock（Linux/Mac）
      # - /var/run/docker.sock:/var/run/docker.sock
    # 默认无 command，走 ENTRYPOINT 的 engram（TUI 模式）
    # 覆盖示例: docker compose run --rm agent cli
    #           docker compose run --rm agent run "研究问题"

  # Postgres — LangGraph checkpointer 持久层（issue 05）。
  # agent 通过 ENGRAM_CHECKPOINT_DSN 注入连接；重启后同一会话状态读回。
  postgres:
    image: postgres:16-alpine
    container_name: engram-postgres
    environment:
      - POSTGRES_USER=engram
      - POSTGRES_PASSWORD=engram
      - POSTGRES_DB=engram
    ports:
      - "5432:5432"
    volumes:
      - ./.engram/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engram -d engram"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Redis — 记忆热层（issue 06）：L3 存储分区键 + TTL 淘汰，redis-cli 可见键与倒计时。
  # 持久化到卷可跨容器重建保留（appendonly）；热层本义是可淘汰，卷丢失≠数据事故。
  redis:
    image: redis:7-alpine
    container_name: engram-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./.engram/redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
