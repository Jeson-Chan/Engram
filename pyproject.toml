[project]
name = "engram"
version = "0.1.0"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.2.3",
    "langchain-openai>=1.1.7",
    "langchain-deepseek>=1.0.1",
    "openai>=1.0.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "textual>=0.40.0",
    "ddgs>=9.0.0",
    "pyyaml>=6.0",
    # === Service layer: gateway + memory tiers (wired in by later issues) ===
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "SQLAlchemy>=2.1.8",
    "redis>=5.0.0",
    # LangGraph session-state persistence (PG async checkpointer)
    "langgraph-checkpoint-postgres>=3.2.0",
    # psycopg[binary]: pure-python psycopg needs system libpq (absent on slim images)
    "psycopg[binary]>=3.3",
]

[project.scripts]
engram = "engram.backend.app.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engram*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    # in-memory redis double for the hot-tier store tests
    "fakeredis>=2.30",
]
docker = [
    "agent-sandbox>=0.0.19",
]
anthropic = [
    "langchain-anthropic>=0.3.0",
]
gemini = [
    "langchain-google-genai>=2.0.0",
]
ollama = [
    "langchain-ollama>=0.3.0",
]
providers = [
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    # in-memory redis double for the hot-tier store tests
    "fakeredis>=2.30",
]
